<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form2Email Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    h1 { margin: 0 0 24px; font-size: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #555; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    textarea { resize: vertical; min-height: 100px; }
    button {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
    }
    #result.success { background: #e6f4ea; color: #1e6e33; }
    #result.error   { background: #fce8e8; color: #8b1c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Form2Email Test</h1>
    <form id="testForm" action="{{ action_url | default('/form2email') }}" method="POST">
      <label for="name">Name <span style="color:red">*</span></label>
      <input type="text" id="name" name="name" required placeholder="Jane Doe">

      <label for="email">Email <span style="color:red">*</span></label>
      <input type="email" id="email" name="email" required placeholder="jane@example.com">

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Test submission">

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Hello, this is a test."></textarea>

      <button type="submit" id="submitBtn">Send Test Email</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById("testForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const result = document.getElementById("result");
      btn.disabled = true;
      btn.textContent = "Sending…";
      result.style.display = "none";

      try {
        const resp = await fetch(this.action, {
          method: "POST",
          body: new FormData(this),
        });
        const data = await resp.json();
        result.className = resp.ok ? "success" : "error";
        result.textContent = data.message || data.error || JSON.stringify(data);
      } catch (err) {
        result.className = "error";
        result.textContent = "Request failed: " + err.message;
      } finally {
        result.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Send Test Email";
      }
    });
  </script>
</body>
</html>
