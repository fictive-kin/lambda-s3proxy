<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form Submission</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .wrapper {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .header {
      background-color: #1a1a2e;
      color: #ffffff;
      padding: 28px 32px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .body {
      padding: 32px;
    }
    .field {
      margin-bottom: 24px;
    }
    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      margin-bottom: 6px;
    }
    .field-value {
      font-size: 15px;
      color: #222;
      line-height: 1.5;
    }
    .field-value a {
      color: #1a73e8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>New Form Submission</h1>
    </div>
    <div class="body">
      {% for field, value in form.items(): %}
        <div class="field">
          <div class="field-label">{{ field|title }}</div>
          <div class="field-value">{{ value }}</div>
        </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
