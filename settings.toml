
[default]

# If needed to ensure that all redirects use a certain hostname, set this appropriately:
# DOMAIN_NAME = "my-example.com"

# Affects response headers
ADD_CACHE_HEADERS = true

# If false, disables the Flask before_request trailing slash redirection handling
TRAILING_SLASH_REDIRECTION = true

# Sets the special endpoint to return the browser's location via CloudFront's geoip headers
# This requires that the API Gateway is behind a _real_ CloudFront distro. If not set,
# no localization endpoint is available
# GEOGRAPHY_ROUTE = '/localizer'

# Enable the use of country_code, when finding points closest to the user. Default is true.
# GEOGRAPHY_USE_COUNTRY_CODE_COMPARISON = true

# Sets the allowed origins for CORS. Should be a list of allowed origins or '*' for any
ALLOWED_ORIGINS = ['*']

# OPTIONS requests bypass all checks other than against ALLOWED_ORIGINS when this is true
SHORTCIRCUIT_OPTIONS = true

# Status code to use for redirects generated from FlaskJSONRedirects
REDIRECTS_DEFAULT_STATUS_CODE = 302

# True if FlaskJSONRedirects should add redirects for both `<path>` and `<path>/`
# False to only handle explicitly defined redirects
REDIRECTS_HANDLE_TRAILING_SLASH = true

# True if FlaskJSONRedirects should include the query string in any redirects returned,
# including those that are FQDN. The query string is always included for relative
# redirects. Default: False
REDIRECTS_INCLUDE_QUERY_ARGS_IN_ALL = true

# The location of various control files within the S3 bucket
S3_REDIRECTS_FILE = 'redirects.json'
S3_AUTHORIZER_FILE = 'authorizations.json'
S3_ELEVENTY_FILE = '11ty-serverless.json'
S3_LOCALES_FILE = 'locales.json'
# Routes file for FlaskFictiveForms (the legacy S3_FORM2EMAIL_FILE key is still honoured)
S3_FICTIVEFORMS_FILE = 'form-to-email.json'

# Status code to use for redirects generated from FlaskS3Proxy
S3PROXY_REDIRECT_CODE = 302

# True if FlaskS3Proxy should not serve index.html paths without a trailing slash
S3PROXY_TRAILING_SLASH_ONLY = false

# True if FlaskS3Proxy should redirect `<path>/` to `<path>` before attempting to check S3
S3PROXY_TRAILING_SLASH_REDIRECTION = true

# The bucket that FlaskS3Proxy should check for files. This should probably be set in the env
# S3PROXY_BUCKET = "some-bucket-name"

# The prefix, if any, that FlaskS3Proxy should add to all proxied requests to S3
# S3PROXY_PREFIX = ""

# Routes that you want handled by FlaskS3Proxy.
# S3PROXY_ROUTES = ["/", "/<path:url>"]

# Locales that are handled by S3Proxy localization. These correspond to path prefixes in
# the S3 bucket.
# S3PROXY_LOCALES = ["de", "fr", "it", "es"]

# A dictionary of routes and buckets that can be used in department-upload-permission
# specific circumstances (among other uses). Any path prior to the `<path:url>` will be
# used as a prefix to the file in it's S3 bucket.
# S3PROXY_SUBROUTES = {"/wp-content/uploads/<path:url>" = "my-wp-backup-bucket"}

# Prefix applied to cookie names and SSI variable names for variant groups (default: "variant_")
# e.g. group "hero-test" → cookie "variant_hero-test", SSI variable $variant_hero_test
# S3PROXY_VARIANT_PREFIX = "variant_"

# S3 prefix where FlaskS3VariantsProxy looks for variant files (default: "variants")
# Variant files are stored at: <S3PROXY_VARIANTS_DIR>/<group_name>/<variant_name>/<original_path>
# S3PROXY_VARIANTS_DIR = "variants"

# Variant groups for FlaskS3VariantsProxy. Each group assigns users to a named variant via a
# cookie (<group_name>=<variant_name>). Weights are optional; omitting them gives equal weight.
# Useful for A/B testing, member vs. non-member content, feature flags, localization, etc.
# S3PROXY_VARIANTS = ""
# [
#   {
#     "name": "hero-test",
#     "type": "cookie",  # Optional. `cookie` is the default type
#     "variants": [
#       {"name": "control", "weight": 50},  # `weight` will be 50/50 if not specified
#       {"name": "treatment", "weight": 50}
#     ]
#   },
#   {
#     "name": "member-status",
#     "type": "permission-level",
#     "variants": [
#       {"name": "member"},
#       {"name": "anonymous"}
#     ]
#   },
#   {
#     "name": "locale",
#     "type": "geo",
#     "geo_field": "country_code",  # Optional. `country_code` is the default. Pulls value from available CloudFront headers
#     "default": "us",  # The default location to use, if no match is available for the header value
#     "variants": [
#       {"name": "eu", "geo_values": ["FR", "UK", "DE", "CH", ...]},
#       {"name": "us", "geo_values": ["US"]},
#     ]
#   }
# ]

# Enable Server Side Include-style directive processing in HTML responses served by
# FlaskS3VariantsProxy. Supports <!--#include virtual="path" --> and <!--#echo var="name" -->.
# Include paths may reference variant variables using $group_name or ${group_name} tokens
# (hyphens in group names become underscores, e.g. $member_status, $hero_test, $locale).
S3PROXY_SSI_ENABLED = false

# S3 key for a JSON file defining variant groups. Same format as S3PROXY_VARIANTS.
# When set, this takes precedence over S3PROXY_VARIANTS.
# S3_VARIANTS_FILE = "variants.json"

# When invoking the preview function, often the first run of the function will return
# incorrect results, thus this allows for an immediate second load, that resolves it
ELEVENTY_BAD_LOAD_WRAPPER_HACK = false

# The first path segment of the URL to the serverless function log review functionality
ELEVENTY_LOGVIEW_PATH = "__logviewer"

# The first path segment to the preview function, required to be able to perform a reload
# as part of the BAD_LOAD_WRAPPER_HACK functionality
ELEVENTY_PREVIEW_PATH_BASE = "__preview"

# To set a generic authentication, do so here, using a base64 encoded username:password
#AUTHORIZER_ROUTES = {"/" = "<base64-user-pass>"}
AUTHORIZER_PATHS_WITHOUT_AUTH = ["/static"]

# If the preview function is returning a bad load on first attempt, set this to true
# which forces a secondary request to fire immediately after the first to circumvent
# the problem
# BAD_LOAD_WRAPPER_HACK = true

# Default CSP policy that we want in place
CSP_DEFAULT_SRC = [
    "data:",
    "https:",
    "self",
    "unsafe-inline"
]
CSP_UPGRADE_INSECURE_REQUESTS = true

# Remeber to include the path used as ELEVENTY_PREVIEW_PATH_BASE above
PATHS_TO_LEAVE_TRAILING_SLASH = [
    "^/preview/",
    "^/__preview/",
]

PATTERNS_TO_404 = [
    ".map$",
]

# The SMTP configuration
# MAIL_SERVER = "smtp.example.com"
MAIL_PORT = 587
MAIL_USE_TLS = true
# MAIL_USERNAME = "user@example.com"
# MAIL_PASSWORD = "password"

# The default sending address to use as the from email address
# MAIL_DEFAULT_SENDER = "noreply@example.com"

# The default mail recipient when no other is specified in the routes below
# MAIL_RECIPIENT = "someone@example.com"

# FlaskFictiveForms creates form submission endpoints from a list of routes. Each
# submission is validated, counted, and then passed through to a 3rd party API and/or
# emailed (form2email). The FICTIVEFORMS_* keys below fall back to the legacy
# FORM2EMAIL_* keys when they are not set.
#
# Route options:
#   - "route": the URL path the form is POSTed to
#   - "template": email template (path to file, s3proxy://key, or template string). Emails
#     are sent to "recipient" (or MAIL_RECIPIENT), and require MAIL_SERVER to be set.
#   - "recipient" / "encryption_key": per-route email overrides
#   - "counter_key": overrides the key used to track submission counts in DynamoDB
#     (defaults to the slugified route path)
#   - "required_fields": fields that must be non-empty (defaults to ["name", "email"], or
#     to none for passthrough routes)
#   - "passthrough": forwards the submission to a 3rd party API. With it set, an email is
#     only sent when a "template" is also given. Without it, an email is always sent,
#     using email/simple.html when no template is given.
#
# Passthrough "type" selects how the API token is obtained:
#   - "oauth" (default): OAuth2 client credentials exchange (client_id + client_secret)
#   - "simple": the client_secret is POSTed to token_url, and the token and its expiry are
#     read from the response using "token_key" and "expires_key" (dotted paths allowed).
#     The expiry may be epoch seconds/milliseconds, seconds from now, or a date string.
# Use "config://KEY" for client_id/client_secret so the secret is read from this config
# (e.g. .secrets.toml or env) rather than the routes file.
#
# FICTIVEFORMS_ROUTES = [
#     {"route": "/contact", "template": "email/simple.html", "recipient": "me@example.com", "counter_key": "contact-form"},
#     {
#         "route": "/signup",
#         "required_fields": ["email"],
#         "passthrough": {
#             "url": "https://api.example.com/v1/submissions",
#             "token_url": "https://auth.example.com/oauth/token",
#             "client_id": "config://SIGNUP_CLIENT_ID",
#             "client_secret": "config://SIGNUP_CLIENT_SECRET",
#             "scope": "submissions:write",          # optional
#             "audience": "https://api.example.com", # optional
#             "auth_method": "basic",                # or "post" (credentials in the token request body)
#             "format": "json",                      # or "form"
#             "field_map": {"email": "emailAddress"},
#             "include_unmapped": true,
#             "extra": {"source": "website"},
#             "headers": {},
#             "timeout": 10
#         }
#     },
#     {
#         "route": "/enquiry",
#         "template": "email/simple.html",          # also send an email
#         "passthrough": {
#             "type": "simple",
#             "url": "https://api.example.com/forms",
#             "token_url": "https://api.example.com/auth/token",
#             "client_secret": "config://ENQUIRY_CLIENT_SECRET",
#             "secret_field": "client_secret",       # name the secret is posted as
#             "token_request_format": "json",        # or "form"
#             "token_key": "data.token",
#             "expires_key": "data.expires",
#             "token_header": "Authorization",       # available to both types
#             "token_prefix": "Bearer "
#         }
#     },
# ]

# DynamoDB table name for storing per-route form submission counters.
# The table must have a partition key named "id" (String).
# When set, each successful submission atomically increments the counter and
# returns the new value as "submission_count" in the JSON response.
# FICTIVEFORMS_COUNTER_TABLE = "my-form-counters"

